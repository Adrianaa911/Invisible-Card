
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@1,408&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    <title>Invisible Card</title>
</head>
<body>

    <div class="container">
        <div class="card-wrapper">
            <div class="card">
                <img src="images/john-doe.jpg" class="card-img" alt="">
                <h1 class="card-heading">John Doe</h1>
                <p class="card-paragraph">
                "Lorem ipsum dolor sit amet consectetur, adipisicing elit. 
                Autem culpa veniam iste vel ratione optio voluptate rerum 
                quibusdam corporis dolorum delectus explicabo quasi, mollitia 
                exercitation, similique quam sit id. Velit?"
               </p>
                <ul class="card-icons">
                    <li>
                        <a href="#" class="card-icon-link">
                           <i class="card-icon fa-brands fa-square-facebook"></i>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="card-icon-link">
                           <i class="card-icon fa-brands fa-linkedin"></i>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="card-icon-link">
                            <i class="card-icon fab fa-twitter-square"></i>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="card-icon-link">
                            <i class="card-icon fab fa-instagram"></i>
                        </a>
                    </li>
                </ul>
                <button class="card-btn">View Profile</button>
            </div>
        </div>
    </div>


    
</body>
</html>
